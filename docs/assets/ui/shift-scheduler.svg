<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">Shift scheduler administrator interface map</title>
  <desc id="desc">Annotated illustration of employee selection, schedule tabs, matching-day editor, week navigation, and seven day cards.</desc>
  <rect width="1400" height="950" fill="#020617"/>
  <rect x="45" y="35" width="1310" height="96" rx="20" fill="#0f172a" stroke="#334155"/>
