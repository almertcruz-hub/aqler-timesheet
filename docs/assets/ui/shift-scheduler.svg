    <g transform="translate(451,620)"><rect width="160" height="205" rx="14" fill="#111827" stroke="#334155"/><text x="18" y="32" fill="#94a3b8" font-size="13" font-weight="700">WEDNESDAY</text><text x="18" y="60" fill="#f8fafc" font-size="17" font-weight="700">Aug 26</text><rect x="18" y="82" width="124" height="38" rx="7" fill="#1e293b"/><text x="48" y="107" fill="#fca5a5" font-size="13">Day off</text></g>
    <g transform="translate(624,620)"><rect width="160" height="205" rx="14" fill="#111827" stroke="#2563eb"/><text x="18" y="32" fill="#93c5fd" font-size="13" font-weight="700">THURSDAY</text><text x="18" y="60" fill="#f8fafc" font-size="17" font-weight="700">Aug 27</text><rect x="18" y="82" width="124" height="38" rx="7" fill="#1e293b"/><text x="40" y="107" fill="#e2e8f0" font-size="13">09:00–17:00</text></g>
    <g transform="translate(797,620)"><rect width="160" height="205" rx="14" fill="#111827" stroke="#2563eb"/><text x="18" y="32" fill="#93c5fd" font-size="13" font-weight="700">FRIDAY</text><text x="18" y="60" fill="#f8fafc" font-size="17" font-weight="700">Aug 28</text><rect x="18" y="82" width="124" height="38" rx="7" fill="#1e293b"/><text x="40" y="107" fill="#e2e8f0" font-size="13">09:00–17:00</text></g>
    <g transform="translate(970,620)"><rect width="160" height="205" rx="14" fill="#111827" stroke="#334155"/><text x="18" y="32" fill="#94a3b8" font-size="13" font-weight="700">SATURDAY</text><text x="18" y="60" fill="#f8fafc" font-size="17" font-weight="700">Aug 29</text><text x="48" y="107" fill="#fca5a5" font-size="13">Day off</text></g>
