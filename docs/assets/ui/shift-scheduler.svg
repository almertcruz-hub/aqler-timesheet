  <text x="110" y="310" fill="#f8fafc" font-family="Arial" font-size="24" font-weight="700">Set matching weekdays</text>
  <text x="110" y="338" fill="#94a3b8" font-family="Arial" font-size="14">Select one or many weekday buttons, enter one time range, then apply it to all selected days.</text>
