  <text x="100" y="920" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="700">4  WEEKDATES.MAP(...) RENDERS ONE CARD FOR EACH MERGED BASELINE/OVERRIDE RESULT</text>
