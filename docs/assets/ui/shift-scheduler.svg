  <rect x="990" y="58" width="310" height="50" rx="10" fill="#111827" stroke="#475569"/><text x="1017" y="89" fill="#e2e8f0" font-family="Arial" font-size="15">Selected employee: Glenda Cruz</text>
  <text x="998" y="126" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="700">1  SELECTEDEMPLOYEEID</text>

