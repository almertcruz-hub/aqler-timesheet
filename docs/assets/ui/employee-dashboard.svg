<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Employee timesheet interface map</title>
  <desc id="desc">Annotated illustration of the employee navigation, time controls, status card, and work log table.</desc>
  <rect width="1400" height="900" fill="#020617"/>
  <rect x="36" y="28" width="1328" height="78" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="70" y="76" fill="#f8fafc" font-family="Arial" font-size="27" font-weight="700">AQLER Timesheet</text>
  <rect x="650" y="49" width="98" height="38" rx="9" fill="#2563eb"/><text x="674" y="74" fill="white" font-family="Arial" font-size="16">Home</text>
  <rect x="765" y="49" width="126" height="38" rx="9" fill="#1e293b"/><text x="789" y="74" fill="#cbd5e1" font-family="Arial" font-size="16">My Shifts</text>
  <rect x="940" y="43" width="250" height="50" rx="25" fill="#1e293b" stroke="#475569"/>
  <circle cx="973" cy="68" r="18" fill="#3b82f6"/><text x="966" y="75" fill="white" font-family="Arial" font-size="18" font-weight="700">E</text>
  <text x="1002" y="66" fill="#f8fafc" font-family="Arial" font-size="14">employee@aqler.tech</text>
  <text x="1002" y="83" fill="#93c5fd" font-family="Arial" font-size="11">Employee</text>
  <rect x="1210" y="49" width="114" height="38" rx="9" fill="#334155"/><text x="1234" y="74" fill="#f8fafc" font-family="Arial" font-size="15">Sign out</text>
  <text x="54" y="136" fill="#60a5fa" font-family="Arial" font-size="14" font-weight="700">1  SHARED NAVIGATION</text>

  <rect x="85" y="165" width="1230" height="210" rx="24" fill="#0f172a" stroke="#1e3a8a"/>
  <text x="125" y="216" fill="#f8fafc" font-family="Arial" font-size="33" font-weight="700">Good morning</text>
  <text x="125" y="247" fill="#94a3b8" font-family="Arial" font-size="17">Record when your work session starts and ends.</text>
  <rect x="125" y="285" width="210" height="56" rx="12" fill="#16a34a"/><text x="188" y="320" fill="white" font-family="Arial" font-size="19" font-weight="700">Time In</text>
  <rect x="355" y="285" width="210" height="56" rx="12" fill="#dc2626" opacity=".5"/><text x="405" y="320" fill="white" font-family="Arial" font-size="19" font-weight="700">Time Out</text>
  <rect x="820" y="202" width="420" height="126" rx="16" fill="#172554" stroke="#2563eb"/>
  <text x="850" y="237" fill="#93c5fd" font-family="Arial" font-size="14" font-weight="700">CURRENT STATUS</text>
  <text x="850" y="277" fill="#f8fafc" font-family="Arial" font-size="26" font-weight="700">Not currently timed in</text>
  <text x="850" y="305" fill="#94a3b8" font-family="Arial" font-size="14">The buttons change after a successful database request.</text>
  <text x="100" y="405" fill="#60a5fa" font-family="Arial" font-size="14" font-weight="700">2  STATE-DRIVEN TIME CONTROLS</text>

  <rect x="85" y="430" width="1230" height="390" rx="24" fill="#0f172a" stroke="#334155"/>
  <text x="125" y="484" fill="#f8fafc" font-family="Arial" font-size="28" font-weight="700">My Work Logs</text>
  <text x="125" y="512" fill="#94a3b8" font-family="Arial" font-size="15">Completed sessions returned from the logs table</text>
  <rect x="114" y="550" width="1172" height="52" rx="8" fill="#1e293b"/>
  <text x="140" y="582" fill="#cbd5e1" font-family="Arial" font-size="14" font-weight="700">TYPE</text><text x="360" y="582" fill="#cbd5e1" font-family="Arial" font-size="14" font-weight="700">DATE</text><text x="610" y="582" fill="#cbd5e1" font-family="Arial" font-size="14" font-weight="700">TIME</text><text x="880" y="582" fill="#cbd5e1" font-family="Arial" font-size="14" font-weight="700">DURATION</text>
  <g fill="#0b1220" stroke="#1e293b"><rect x="114" y="614" width="1172" height="62"/><rect x="114" y="676" width="1172" height="62"/><rect x="114" y="738" width="1172" height="62"/></g>
  <g font-family="Arial" font-size="15" fill="#e2e8f0"><text x="140" y="652">Time In</text><text x="360" y="652">2026-08-27</text><text x="610" y="652">09:00</text><text x="880" y="652">—</text><text x="140" y="714">Time Out</text><text x="360" y="714">2026-08-27</text><text x="610" y="714">17:00</text><text x="880" y="714">8h 0m</text></g>
  <text x="100" y="856" fill="#60a5fa" font-family="Arial" font-size="14" font-weight="700">3  REPEATED TABLE ROWS CREATED WITH .map()</text>
</svg>
