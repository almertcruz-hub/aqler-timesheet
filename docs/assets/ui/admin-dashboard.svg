<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Administrator logs and reminders interface map</title>
  <desc id="desc">Annotated illustration of administrator search, export, work log table, reminder form, and active schedules.</desc>
  <rect width="1400" height="900" fill="#020617"/>
  <rect x="42" y="35" width="1316" height="90" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="78" fill="#f8fafc" font-family="Arial" font-size="26" font-weight="700">Administrator</text>
  <text x="75" y="103" fill="#94a3b8" font-family="Arial" font-size="14">Logs · Scheduled emails · Shifts</text>
  <rect x="987" y="57" width="320" height="46" rx="23" fill="#1e293b"/><text x="1025" y="86" fill="#e2e8f0" font-family="Arial" font-size="14">admin@aqler.tech · Administrator</text>

  <rect x="75" y="160" width="1250" height="390" rx="22" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="205" fill="#60a5fa" font-family="Arial" font-size="13" font-weight="700">ADMIN</text>
  <text x="110" y="244" fill="#f8fafc" font-family="Arial" font-size="31" font-weight="700">Employee Work Logs</text>
  <text x="110" y="273" fill="#94a3b8" font-family="Arial" font-size="15">View time-in and time-out activity across all employees.</text>
  <rect x="780" y="208" width="290" height="48" rx="10" fill="#111827" stroke="#475569"/><text x="805" y="238" fill="#94a3b8" font-family="Arial" font-size="14">Search employee, email, or date</text>
  <rect x="1090" y="208" width="190" height="48" rx="10" fill="#16a34a"/><text x="1130" y="238" fill="white" font-family="Arial" font-size="15" font-weight="700">Export CSV</text>
  <text x="780" y="291" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="700">1  CONTROLLED SEARCH</text><text x="1090" y="291" fill="#4ade80" font-family="Arial" font-size="12" font-weight="700">2  DOWNLOAD ACTION</text>
  <rect x="110" y="320" width="1170" height="50" rx="8" fill="#1e293b"/>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#cbd5e1"><text x="135" y="351">EMPLOYEE</text><text x="390" y="351">EMAIL</text><text x="675" y="351">TYPE</text><text x="830" y="351">DATE</text><text x="1045" y="351">TIME</text><text x="1170" y="351">DURATION</text></g>
  <g fill="#0b1220" stroke="#1e293b"><rect x="110" y="380" width="1170" height="58"/><rect x="110" y="438" width="1170" height="58"/></g>
  <g font-family="Arial" font-size="14" fill="#e2e8f0"><text x="135" y="415">Glenda Cruz</text><text x="390" y="415">glenda@aqler.tech</text><text x="675" y="415">Time In</text><text x="830" y="415">2026-08-27</text><text x="1045" y="415">09:02</text><text x="1170" y="415">—</text><text x="135" y="473">Employee Two</text><text x="390" y="473">employee@aqler.tech</text><text x="675" y="473">Time Out</text><text x="830" y="473">2026-08-27</text><text x="1045" y="473">17:11</text><text x="1170" y="473">8h 9m</text></g>
  <text x="110" y="525" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="700">3  FILTEREDLOGS.MAP(...) CREATES ONE ROW PER MATCH</text>

  <rect x="75" y="585" width="600" height="265" rx="22" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="630" fill="#f8fafc" font-family="Arial" font-size="25" font-weight="700">Schedule an email</text>
  <rect x="110" y="660" width="240" height="44" rx="8" fill="#111827" stroke="#475569"/><text x="128" y="687" fill="#94a3b8" font-family="Arial" font-size="13">Choose employee</text>
  <g fill="#2563eb"><rect x="110" y="726" width="44" height="34" rx="8"/><rect x="162" y="726" width="44" height="34" rx="8"/><rect x="214" y="726" width="44" height="34" rx="8"/><rect x="266" y="726" width="44" height="34" rx="8"/><rect x="318" y="726" width="44" height="34" rx="8"/></g>
  <g fill="white" font-family="Arial" font-size="12"><text x="125" y="748">M</text><text x="177" y="748">T</text><text x="228" y="748">W</text><text x="280" y="748">Th</text><text x="333" y="748">F</text></g>
  <rect x="385" y="726" width="110" height="42" rx="8" fill="#111827" stroke="#475569"/><text x="413" y="752" fill="#e2e8f0" font-family="Arial" font-size="14">17:00</text>
  <rect x="110" y="790" width="200" height="42" rx="9" fill="#2563eb"/><text x="137" y="816" fill="white" font-family="Arial" font-size="14" font-weight="700">Save schedule</text>

  <rect x="705" y="585" width="620" height="265" rx="22" fill="#0f172a" stroke="#334155"/>
  <text x="740" y="630" fill="#f8fafc" font-family="Arial" font-size="25" font-weight="700">Active scheduled emails</text>
  <rect x="740" y="662" width="550" height="72" rx="12" fill="#1e293b"/><text x="765" y="692" fill="#f8fafc" font-family="Arial" font-size="15" font-weight="700">Employee Two · Monday–Friday · 5:00 PM</text><text x="765" y="716" fill="#94a3b8" font-family="Arial" font-size="13">Asia/Manila</text><rect x="1175" y="679" width="90" height="38" rx="8" fill="#7f1d1d"/><text x="1193" y="703" fill="#fecaca" font-family="Arial" font-size="13">Cancel</text>
  <text x="740" y="775" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="700">ONLY ACTIVE DATABASE ROWS ARE RENDERED</text>
</svg>
